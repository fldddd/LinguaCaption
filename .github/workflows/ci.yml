name: CI

on:
  push:
    branches: [develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python-backend/requirements.txt
      - run: pip install flake8
      - run: flake8 . --max-line-length=120 --ignore=F401,F824 --exclude=__pycache__,test_b5.py,test_b6.py

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: python-backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-timeout httpx
      - run: python test_b5.py && python test_b6.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
